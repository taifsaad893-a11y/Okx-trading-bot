name: XAUUSD USDJPY Strategy Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * 1-5'

permissions:
  contents: write

concurrency:
  group: strategy-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scan and alert
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_alerts.py
      - name: Persist alert state
        run: |
          if [ -f signal_state.json ] && ! git diff --quiet -- signal_state.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add signal_state.json
            git commit -m "Update strategy alert state"
            git push
          fi
