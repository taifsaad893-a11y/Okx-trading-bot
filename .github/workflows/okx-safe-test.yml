name: OKX Safe Demo Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "okx_safe_test.py"
      - "scanner.py"
      - "demo_trader.py"
      - "requirements.txt"
      - ".github/workflows/okx-safe-test.yml"

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OKX demo authentication test
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: python okx_safe_test.py

      - name: Run strategy scanner
        run: python scanner.py

      - name: Verify demo trader safety lock
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          ENABLE_DEMO_ORDERS: "NO"
        run: python demo_trader.py
