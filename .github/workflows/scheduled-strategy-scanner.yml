name: Scheduled XAUUSD Gold Scanner

'on':
  # External cron-job.org dispatch is the verified scheduler.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-strategy-scanner.yml'
      - 'scanner.py'
      - 'discord_alerts.py'

permissions:
  contents: write

concurrency:
  group: market-scanner-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify delivery and request reuse
        run: python -m unittest discover -s tests -v
      - name: Run scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python discord_alerts.py

