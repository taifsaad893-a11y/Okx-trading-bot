name: Scheduled XAUUSD Gold Scanner

'on':
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-strategy-scanner.yml'

permissions:
  contents: write

concurrency:
  group: market-scanner-state
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in $(seq 1 5); do
            echo "SCAN $i/5 at $(date -u +%FT%TZ)"
            python telegram_alerts.py || echo "Scan $i failed; continuing"
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
